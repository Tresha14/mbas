# Gaze + iris CNN, random init. Pre-train on MPIIGaze (person-wise), fine-tune on our calibration captures.
name: gaze_iris
seed: 42
model:
  width: 32
  dim: 128
  dropout: 0.2
data:
  workers: 4
  limit: null
train:
  epochs: 25
  batch_size: 256
  lr: 0.001
  weight_decay: 0.0001
  warmup_steps: 300
  iris_weight: 0.5
  onscreen_weight: 1.0
  amp: true
